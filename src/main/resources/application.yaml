spring:
  application:
    name: Btth_Session13

  # ── Datasource (Supabase PostgreSQL) ────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://<SUPABASE_HOST>:5432/postgres
    username: postgres
    password: <SUPABASE_DB_PASSWORD>
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Spring AI ───────────────────────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small

    # PGVector store (Supabase)
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536           # matches text-embedding-3-small output
        initialize-schema: true    # auto-create vector_store table on first run

    # JDBC chat memory (uses the same datasource)
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    # MCP Server configuration
    mcp:
      server:
        name: lotusbay-mcp-server
        version: 1.0.0

  # ── SQL initialisation ──────────────────────────────────────────────────────
  sql:
    init:
      mode: always

server:
  port: 8080

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.ai: DEBUG
    demo.btth_session13: DEBUG

