plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'demo'
version = '0.0.1-SNAPSHOT'
description = 'Btth_Session13'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.1")
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring AI - OpenAI model
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Spring AI - PGVector store (Supabase)
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // Spring AI - MCP Server (WebMVC transport)
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    // Spring AI - PDF document reader for RAG ingestion
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'

    // Spring AI - JDBC chat memory repository
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

    // PostgreSQL driver (for Supabase PGVector)
    runtimeOnly 'org.postgresql:postgresql'

    // MySQL driver (kept for other datasource if needed)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
